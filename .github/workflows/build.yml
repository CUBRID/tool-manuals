name: Build

on:
  pull_request:
    branches: [develop, "release/[0-9]*"]
  push:
    branches: [develop, "release/[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# ---------------------------------------------------------------------------
# [JOB 1] Build every manual (HTML + PDF)
# ---------------------------------------------------------------------------
jobs:
  build_docs:
    runs-on: ubuntu-latest
    outputs:
      merged_pr: ${{ steps.pr_info.outputs.merged_pr }}
      short_sha: ${{ steps.sha.outputs.short_sha }}
    strategy:
      fail-fast: false
      matrix:
        manual: [ca-manual, cmt-manual, web-manager-manual]
    steps:
      - uses: actions/checkout@v4

      - name: Compute short SHA
        id: sha
        run: echo "short_sha=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build HTML
        run: make ${{ matrix.manual }}

      - name: Build PDF
        run: make ${{ matrix.manual }}-pdf

      - name: Copy PDF into HTML output
        run: |
          pdf=$(find "${{ matrix.manual }}/_build/simplepdf" -maxdepth 1 -name '*.pdf' | head -n1)
          if [ -n "$pdf" ]; then
            cp "$pdf" "${{ matrix.manual }}/_build/html/"
          fi

      # Save PR number for the official-deploy comment (push event only)
      - name: Get PR number
        if: github.event_name == 'push'
        id: pr_info
        run: |
          PR_NUMBER=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" \
            | jq -r '.[0].number')
          echo "merged_pr=${PR_NUMBER:-manual-push}" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifact-${{ matrix.manual }}
          path: ./${{ matrix.manual }}/_build/html
          retention-days: 7

  # ---------------------------------------------------------------------------
  # [JOB 2] Deploy to gh-pages (one manual at a time)
  # ---------------------------------------------------------------------------
  deploy_docs:
    needs: build_docs
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: gh-pages-deploy
      cancel-in-progress: false
    strategy:
      matrix:
        manual: [ca-manual, cmt-manual, web-manager-manual]
      max-parallel: 1
    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: build-artifact-${{ matrix.manual }}
          path: ./dist

      # --- PR Preview Deploy ---
      - name: Deploy Preview
        if: github.event_name == 'pull_request'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: pr-preview/${{ github.event.pull_request.number }}/${{ matrix.manual }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

      # --- Official Deploy (per-commit) ---
      - name: Deploy Official (per-commit)
        if: github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: ./dist
          destination_dir: ${{ matrix.manual }}/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}
          keep_files: true
          user_name: 'github-actions[bot]'
          user_email: 'github-actions[bot]@users.noreply.github.com'

  # ---------------------------------------------------------------------------
  # [JOB 3] Post comments (after deploy finishes)
  # ---------------------------------------------------------------------------
  comment_on_pr:
    needs: [build_docs, deploy_docs]
    if: success()
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      # --- Case A: PR Preview Links ---
      - name: Comment PR Preview Links
        if: github.event_name == 'pull_request'
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.pull_request.number }}
          message: |
            ✅ **Manual Preview is Ready!**

            | Manual | 🌐 Web | 📄 PDF |
            | :--- | :--- | :--- |
            | CUBRID Admin | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/ca-manual/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/ca-manual/CUBRID%20Admin.pdf) |
            | CUBRID Migration Toolkit | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/cmt-manual/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/cmt-manual/CUBRID%20Migration%20Toolkit.pdf) |
            | CUBRID Web Manager | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/web-manager-manual/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/${{ github.event.pull_request.number }}/web-manager-manual/CUBRID%20Web%20Manager.pdf) |
          comment_tag: tool-manuals-preview
          mode: recreate

      # --- Case B: Official Deployment Success (merge only) ---
      - name: Comment Official Deploy Success
        if: github.event_name == 'push' && needs.build_docs.outputs.merged_pr != 'null' && needs.build_docs.outputs.merged_pr != 'manual-push'
        uses: thollander/actions-comment-pull-request@v2
        with:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ needs.build_docs.outputs.merged_pr }}
          message: |
            🚀 **Official Deployment Complete!** (`${{ needs.build_docs.outputs.short_sha }}`)

            | Manual | 🌐 Web | 📄 PDF |
            | :--- | :--- | :--- |
            | CUBRID Admin | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ca-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/ca-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/CUBRID%20Admin.pdf) |
            | CUBRID Migration Toolkit | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cmt-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/cmt-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/CUBRID%20Migration%20Toolkit.pdf) |
            | CUBRID Web Manager | [View Docs](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/web-manager-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/index.html) | [Download](https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/web-manager-manual/${{ github.ref_name }}/${{ needs.build_docs.outputs.short_sha }}/CUBRID%20Web%20Manager.pdf) |
          comment_tag: tool-manuals-official-deploy
          mode: create
