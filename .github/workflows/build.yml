name: Build

on:
  pull_request:
  push:
    branches: [develop, "release/[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# This workflow only ever reads the checked-out code and uploads artifacts —
# it never has write access to repository contents or PRs, and never sees
# secrets. That makes it safe to run against pull_request (including PRs
# from forks). Deployment and PR comments are handled by deploy.yml, a
# separate workflow triggered by workflow_run: its YAML is always read from
# the default branch (never from a PR head), so a fork PR cannot smuggle in
# changes to the privileged deploy steps.
# ---------------------------------------------------------------------------
jobs:
  metadata:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Resolve merged PR number (push event only)
        if: github.event_name == 'push'
        id: pr_info
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/pulls" --jq '.[0].number // empty')
          echo "merged_pr=$PR_NUMBER" >> "$GITHUB_OUTPUT"

      - name: Save event metadata
        run: |
          mkdir -p meta
          echo "${{ github.event_name }}"                >  meta/event_name
          echo "${{ github.event.pull_request.number }}"  >  meta/pr_number
          echo "${{ steps.pr_info.outputs.merged_pr }}"   >  meta/merged_pr
          echo "${{ github.ref_name }}"                   >  meta/ref_name
          echo "${GITHUB_SHA::7}"                          >  meta/short_sha

      - name: Upload metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-metadata
          path: meta
          retention-days: 7

  build_docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manual: [ca-manual, cmt-manual, web-manager-manual]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build HTML
        run: make ${{ matrix.manual }}

      - name: Build PDF
        run: make ${{ matrix.manual }}-pdf

      - name: Copy PDF into HTML output
        run: |
          pdf=$(find "${{ matrix.manual }}/_build/simplepdf" -maxdepth 1 -name '*.pdf' | head -n1)
          if [ -n "$pdf" ]; then
            cp "$pdf" "${{ matrix.manual }}/_build/html/"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifact-${{ matrix.manual }}
          path: ./${{ matrix.manual }}/_build/html
          retention-days: 7
