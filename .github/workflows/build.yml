name: Build

on:
  pull_request:
  push:
    branches: [develop, "release/[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

# ---------------------------------------------------------------------------
# This workflow only ever reads the checked-out code and uploads artifacts —
# it never has write access to repository contents or PRs, and never sees
# secrets. That makes it safe to run against pull_request (including PRs
# from forks). Deployment and PR comments are handled by deploy.yml, a
# separate workflow triggered by workflow_run: its YAML is always read from
# the default branch (never from a PR head), so a fork PR cannot smuggle in
# changes to the privileged deploy steps.
#
# deploy.yml does NOT trust anything this workflow computes (event type,
# branch, commit, PR number) — a fork PR can edit this file's steps freely,
# so none of that would be authoritative. It only decides what to build;
# deploy.yml re-derives who/what/where from the workflow_run event itself.
# ---------------------------------------------------------------------------
jobs:
  build_docs:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        manual: [ca-manual, cmt-manual, web-manager-manual]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.3.1

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libpango-1.0-0 libpangoft2-1.0-0 libcairo2 libgdk-pixbuf-2.0-0

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Build HTML
        run: make ${{ matrix.manual }}

      - name: Build PDF
        run: make ${{ matrix.manual }}-pdf

      - name: Copy PDF into HTML output
        run: |
          pdf=$(find "${{ matrix.manual }}/_build/simplepdf" -maxdepth 1 -name '*.pdf' | head -n1)
          if [ -n "$pdf" ]; then
            cp "$pdf" "${{ matrix.manual }}/_build/html/"
          fi

      - name: Upload build artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: build-artifact-${{ matrix.manual }}
          path: ./${{ matrix.manual }}/_build/html
          retention-days: 7
